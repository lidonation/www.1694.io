services:
    1694.test:
        build:
            context: 1694.io/vendor/laravel/sail/runtimes/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.2/app
        container_name: 1694.test
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '3000:${APP_PORT:-80}'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        env_file:
            -   ./1694.io/.env
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - './1694.io:/var/www/html'
        networks:
            - 1694.io
        depends_on:
            - 1694-db
            - 1694-redis
            - 1694-meilisearch
    1694-db:
        image: postgres:15.2-alpine3.17
        container_name: 1694db
        environment:
            POSTGRES_LOGGING: true
            POSTGRES_DB: '${POSTGRES_DATABASE:-governor}'
            POSTGRES_USER: '${POSTGRES_USERNAME:-cardano}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-MdT6Sc7XfrpCMJw4D}'
            POSTGRES_POSTGRES_PASSWORD: '${POSTGRES_ROOT_PASSWORD:-bVd95i3mUPLKYqGVCRtN}'
        ports:
            - "${POSTGRES_PORT:-5436}:5432"
        env_file:
            -   ./1694.io/.env
        healthcheck:
            test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 10s
            timeout: 2s
            retries: 10
        volumes:
            - type: volume
              source: 1694-db
              target: /var/lib/postgresql/data
              volume:
                  nocopy: true
        logging:
            driver: "json-file"
            options:
                max-size: "200k"
                max-file: "10"
        networks:
        - 1694.io
    1694-redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - '1694-redis:/data'
        networks:
            - 1694.io
        env_file:
            -   ./1694.io/.env
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    1694-meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - '1694-meilisearch:/meili_data'
        networks:
            - 1694.io
        env_file:
            -   ./1694.io/.env
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://localhost:7700/health'
            retries: 3
            timeout: 5s
networks:
    1694.io:
        driver: bridge
volumes:
    1694-db:
        driver: local
    1694-redis:
        driver: local
    1694-meilisearch:
        driver: local
