variables:
  AUTO_DEPLOY_IMAGE_VERSION: v2.50.0
  CI_TEMPLATE_REGISTRY_HOST: registry.gitlab.com
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  HELM_VERSION: 3.10.2
  KUBERNETES_VERSION: 1.24.9
  DEPLOY_CARDANO_DBSYNC:
    value: "false"
    description: "Install cardano dbsync services (ogmios, hasura, postgres, grapql)"
  DEPLOY_WEBSITE:
    value: "true"
    description: "Build and deploy www.lidonation.com"
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/frontend/cache/Cypress"

stages:
  - build
  - preview
  - production
  - test

before_script:
  - |
    export APP_VERSION=$(awk '/version/{gsub(/("|",)/,"",$2);print $2};' frontend/package.json)
    export APP_VERSION_AND_BUILD="${APP_VERSION}-${CI_PIPELINE_ID}"
    export CI_APPLICATION_REPOSITORY=$CI_REGISTRY_IMAGE
    export CI_APPLICATION_TAG=$APP_VERSION_AND_BUILD

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ./node_modules

services:
  - name: docker:dind
    alias: docker
    command: ["--tls=false"]

.auto-deploy:
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  dependencies: []


.deploy_template: &deploy_template
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  retry: 0
  cache: {}

# First step of every full deploy, before any helm or kubectl call (auto-deploy
# download_chart runs helm). It stops the job when one of the four IPFS cluster
# settings is missing for this environment, or when an env file the job loads
# also sets it (lidonation#791). It names keys, never values.
.check_ipfs_settings:
  script:
    - sh ci/check-ipfs-settings.sh "$ENV_FILE_BACKEND" "$ENV_FILE_QUEUE" "$ENV_FILE_FRONTEND" ${GLOBAL_ENV_FILE:+"$GLOBAL_ENV_FILE"}



build_frontend:
  stage: build
  image: docker:27-cli
  retry: 1
  script:
    - |
      set -xev

      cat $ENV_FILE_NEXT_PUBLIC_TEMPLATE > frontend/.env.production

      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building Dockerfile with tags $CI_APPLICATION_REPOSITORY/1694.io-frontend:$CI_APPLICATION_TAG and $CI_APPLICATION_REPOSITORY/www.1694.io-frontend:latest ..."
      docker build --network host -f frontend/Dockerfile \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-frontend:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-frontend:latest" .

      docker push "$CI_APPLICATION_REPOSITORY/1694.io-frontend:$CI_APPLICATION_TAG"
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-frontend:latest"
  rules:
    - if: '$DEPLOY_WEBSITE == "true"'

build_backend:
  stage: build
  image: docker:27-cli
  retry: 1
  script:
    - |
      set -xev

      cat $ENV_FILE > backend/.env.production
      sh ci/prepare-cardano-env.sh "$ENV_FILE_BACKEND" backend/.env.production
      cat $ENV_FILE_FRONTEND > frontend/.env.production
      cp backend/.env.production ./chart/backend_env
            
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building Dockerfile with tags $CI_APPLICATION_REPOSITORY/1694.io-backend:$CI_APPLICATION_TAG and $CI_APPLICATION_REPOSITORY/www.1694.io-backend:latest ..."

      docker build --network host -f backend/Dockerfile \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-backend:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-backend:latest" .
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-backend:$CI_APPLICATION_TAG"
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-backend:latest"
  rules:
    - if: '$DEPLOY_WEBSITE == "true"'

build_queue_backend:
  stage: build
  image: docker:27-cli
  retry: 1
  script:
    - |
      set -xev

      sh ci/prepare-cardano-env.sh "$ENV_FILE_QUEUE" queue-backend/.env.production
      cp queue-backend/.env.production ./chart/queue_env
            
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building Dockerfile with tags $CI_APPLICATION_REPOSITORY/1694.io-queue-backend:$CI_APPLICATION_TAG and $CI_APPLICATION_REPOSITORY/www.1694.io-queue-backend:latest ..."

      docker build --network host -f queue-backend/Dockerfile \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:latest" .
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:$CI_APPLICATION_TAG"
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:latest"
  rules:
    - if: '$DEPLOY_WEBSITE == "true"'



app-preview:
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  stage: preview
  script:
    - !reference [.check_ipfs_settings, script]
    - sh ci/check-cardano-settings.sh "$ENV_FILE_BACKEND"
    - sh ci/select-kube-context.sh
    - auto-deploy check_kube_domain
    - auto-deploy download_chart
    # - auto-deploy ensure_namespace
    - |
      set -xev

      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"    
      sh ci/prepare-cardano-env.sh "$ENV_FILE_BACKEND" backend/.env.production
      cat $ENV_FILE_FRONTEND > frontend/.env.production
      cp backend/.env.production ./chart/backend_env

      cp $ENV_FILE_FRONTEND ./chart/frontend_env

      sh ci/prepare-cardano-env.sh "$ENV_FILE_QUEUE" queue-backend/.env.production
      cp queue-backend/.env.production ./chart/queue_env

      if [ -n "$GLOBAL_ENV_FILE" ]; then cp "$GLOBAL_ENV_FILE" ./chart/global_env; else touch ./chart/global_env; fi

      # No registry pull secrets are created — the cluster nodes authenticate
      # pulls at the node level (k3s registries.yaml + long-lived read_registry
      # token). A per-deploy secret would only shadow the node creds.

      echo "AUTO_DEVOPS_WEB_DOMAIN: $AUTO_DEVOPS_WEB_DOMAIN"

      helm upgrade $DEPLOYMENT_NAME ./chart --install \
        -f ./chart/values.yaml \
        -f ./chart/values.contabo.yaml \
        --timeout 600s \
        --wait \
        --namespace="$KUBE_NAMESPACE" \
        --set image.tag=$CI_APPLICATION_TAG \
        --set backend.replicaCount=1 \
        --set frontend.replicaCount=1 \
        --set queue.replicaCount=1 \
        --set governanceIndexer.replicaCount="${GOVERNANCE_INDEXER_REPLICAS:-0}" \
        --set governanceIndexer.image.tag=$INDEXER_TAG \
        --set cnpg.superuserPassword="$CNPG_SUPERUSER_PASSWORD" \
        --set-string ipfs.clusterApiUrl="$IPFS_CLUSTER_API_URL" \
        --set-string ipfs.clusterApiUser="$IPFS_CLUSTER_API_USER" \
        --set-string ipfs.clusterApiPassword="$IPFS_CLUSTER_API_PASSWORD" \
        --set-string ipfs.gatewayUrl="$IPFS_GATEWAY_URL" \
        --set gateway.hosts[0]="$AUTO_DEVOPS_WEB_DOMAIN" \
        --set gateway.api="$API" \
        --set namespace=$KUBE_NAMESPACE \
        --namespace="$KUBE_NAMESPACE" \
        --create-namespace
    - auto-deploy persist_environment_url
  artifacts:
    paths: [environment_url.txt]
  needs:
    - job: build_frontend
    - job: build_backend
    - job: build_queue_backend
  environment:
    name: preview
  rules:
    - if: $DEPLOY_WEBSITE == 'true'
      when: manual



production:
  stage: production
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  environment:
    name: production
  script:
    - !reference [.check_ipfs_settings, script]
    - sh ci/check-cardano-settings.sh "$ENV_FILE_BACKEND"
    - sh ci/select-kube-context.sh
    - auto-deploy check_kube_domain
    - auto-deploy download_chart
    # - auto-deploy ensure_namespace
    - |
      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"

      sh ci/prepare-cardano-env.sh "$ENV_FILE_BACKEND" backend/.env.production
      cat $ENV_FILE_FRONTEND > frontend/.env.production
      cp backend/.env.production ./chart/backend_env

      cp $ENV_FILE_FRONTEND ./chart/frontend_env

      sh ci/prepare-cardano-env.sh "$ENV_FILE_QUEUE" queue-backend/.env.production
      cp queue-backend/.env.production ./chart/queue_env

      if [ -n "$GLOBAL_ENV_FILE" ]; then cp "$GLOBAL_ENV_FILE" ./chart/global_env; else touch ./chart/global_env; fi

      # GOVERNANCE_INDEXER_REPLICAS (CI/CD variable) defaults to 0: the
      # voltaire/governance-indexer repo and its image were lost with the old
      # cluster, and a replica that cannot pull fails `helm --wait`. Set it to
      # 1 once that image exists again.
      helm upgrade $DEPLOYMENT_NAME ./chart --install \
        -f ./chart/values.yaml \
        -f ./chart/values.prod.yaml \
        -f ./chart/values.contabo.yaml \
        --timeout 600s \
        --wait \
        --set image.repository=$CI_APPLICATION_REPOSITORY/www.1694.io \
        --set image.tag=$CI_APPLICATION_TAG \
        --set backend.replicaCount=5 \
        --set frontend.replicaCount=5 \
        --set queue.replicaCount=2 \
        --set governanceIndexer.replicaCount="${GOVERNANCE_INDEXER_REPLICAS:-0}" \
        --set governanceIndexer.image.tag=$INDEXER_TAG \
        --set cnpg.superuserPassword="$CNPG_SUPERUSER_PASSWORD" \
        --set-string ipfs.clusterApiUrl="$IPFS_CLUSTER_API_URL" \
        --set-string ipfs.clusterApiUser="$IPFS_CLUSTER_API_USER" \
        --set-string ipfs.clusterApiPassword="$IPFS_CLUSTER_API_PASSWORD" \
        --set-string ipfs.gatewayUrl="$IPFS_GATEWAY_URL" \
        --set gateway.hosts[0]="$AUTO_DEVOPS_WEB_DOMAIN" \
        --set gateway.api="$API" \
        --set namespace=$KUBE_NAMESPACE \
        --namespace="$KUBE_NAMESPACE" \
        --create-namespace
    - auto-deploy persist_environment_url
  artifacts:
    paths: [environment_url.txt]
  needs:
    - job: app-preview
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && ($DEPLOY_WEBSITE == "true")'
      when: manual

# ---------------------------------------------------------------------------
# Governance indexer auto-deploy (triggered by governance-indexer CI)
# Runs helm upgrade --reuse-values so only the indexer image changes —
# all other stack config (backend, frontend, queue) is left untouched.
# ---------------------------------------------------------------------------

deploy-indexer-preview:
  stage: preview
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  environment:
    name: preview
  script:
    # --reuse-values still re-renders every template, secret.backend.yaml
    # included, so this job passes the IPFS settings too (lidonation#791).
    - !reference [.check_ipfs_settings, script]
    - sh ci/check-cardano-settings.sh "$ENV_FILE_BACKEND"
    - sh ci/select-kube-context.sh
    - |
      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"
      echo "Deploying governance-indexer $INDEXER_TAG ($INDEXER_SHA) to preview..."
      helm upgrade $DEPLOYMENT_NAME ./chart \
        --reuse-values \
        --set preserveExistingAppEnv=true \
        -f ./chart/values.contabo.yaml \
        --timeout 120s \
        --wait \
        --namespace="$KUBE_NAMESPACE" \
        --set governanceIndexer.image.tag="$INDEXER_TAG" \
        --set governanceIndexer.image.sha="$INDEXER_SHA" \
        --set-string ipfs.clusterApiUrl="$IPFS_CLUSTER_API_URL" \
        --set-string ipfs.clusterApiUser="$IPFS_CLUSTER_API_USER" \
        --set-string ipfs.clusterApiPassword="$IPFS_CLUSTER_API_PASSWORD" \
        --set-string ipfs.gatewayUrl="$IPFS_GATEWAY_URL"
      echo "Done."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $INDEXER_TAG && $INDEXER_SHA'

deploy-indexer-production:
  stage: production
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  environment:
    name: production
  script:
    # --reuse-values still re-renders every template, secret.backend.yaml
    # included, so this job passes the IPFS settings too (lidonation#791).
    - !reference [.check_ipfs_settings, script]
    - sh ci/check-cardano-settings.sh "$ENV_FILE_BACKEND"
    - sh ci/select-kube-context.sh
    - |
      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"
      echo "Deploying governance-indexer $INDEXER_TAG ($INDEXER_SHA) to production..."
      helm upgrade $DEPLOYMENT_NAME ./chart \
        --reuse-values \
        --set preserveExistingAppEnv=true \
        -f ./chart/values.contabo.yaml \
        --timeout 120s \
        --wait \
        --namespace="$KUBE_NAMESPACE" \
        --set governanceIndexer.image.tag="$INDEXER_TAG" \
        --set governanceIndexer.image.sha="$INDEXER_SHA" \
        --set-string ipfs.clusterApiUrl="$IPFS_CLUSTER_API_URL" \
        --set-string ipfs.clusterApiUser="$IPFS_CLUSTER_API_USER" \
        --set-string ipfs.clusterApiPassword="$IPFS_CLUSTER_API_PASSWORD" \
        --set-string ipfs.gatewayUrl="$IPFS_GATEWAY_URL"
      echo "Done."
  needs:
    - job: deploy-indexer-preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $INDEXER_TAG && $INDEXER_SHA && $INDEXER_TAG == "latest"'

# Tests for the deploy checks and the chart (lidonation#791). Runs in seconds
# with no cluster access, on every branch and merge request pipeline.
test_deploy_config:
  tags: [lido-ci]   # portable: cluster runner or a Mac docker runner, whichever is free
  stage: test
  image:
    name: alpine/helm:3.18.2
    entrypoint: [""]
  services: []
  cache: {}
  before_script: []
  needs: []
  dependencies: []
  script:
    - sh ci/tests/check-ipfs-settings.test.sh
    - sh ci/tests/chart-ipfs.test.sh
    - sh ci/tests/chart-cardano-api.test.sh
    - sh ci/tests/check-cardano-settings.test.sh
    - sh ci/tests/backup-exclusions.test.sh
    - sh ci/tests/ci-config-ipfs.test.sh
    - sh ci/tests/select-kube-context.test.sh
    - sh ci/tests/entrypoint-placeholder.test.sh
    - sh ci/tests/frontend-runtime-env.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Maps the canonical branches to the public GitHub copy so the open-source
# listing (e.g. cardano.org) always points at fresh code. GitHub is a
# READ-ONLY mirror — all development happens on GitLab (see CONTRIBUTING.md).
#
# One-time setup (maintainer): create a GitHub fine-grained PAT with
# Contents: read & write on IntersectMBO/drep-campaign-platform, then save it
# as a GitLab project CI/CD variable named GITHUB_MIRROR_TOKEN
# (Settings > CI/CD > Variables; masked, and protected if prod-only).
# Until the token is set, this job logs a notice and exits green.
# --force keeps the mirror an exact copy (divergent history from the old
# one-time export is expected on the first sync).
mirror_to_github:
  tags: [lido-ci]   # portable: cluster runner or a Mac docker runner, whichever is free
  stage: test
  image: alpine/git:latest
  # No docker here: drop the global docker:dind service, which the unprivileged
  # Mac docker runners cannot start.
  services: []
  rules:
    - if: '($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev") && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
  script:
    - |
      if [ -z "$GITHUB_MIRROR_TOKEN" ]; then
        echo "GITHUB_MIRROR_TOKEN not set — skipping GitHub mirror."
        echo "Set it in GitLab project Settings > CI/CD > Variables (masked)."
        exit 0
      fi
      git remote add github "https://oauth2:${GITHUB_MIRROR_TOKEN}@github.com/lidonation/www.1694.io.git" 2>/dev/null || \
        git remote set-url github "https://oauth2:${GITHUB_MIRROR_TOKEN}@github.com/lidonation/www.1694.io.git"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        git push github "HEAD:main" --force
        git fetch origin dev
        git push github FETCH_HEAD:dev --force
        echo "Mirrored main and dev to lidonation/www.1694.io."
      else
        git push github "HEAD:${CI_COMMIT_BRANCH}" --force
        echo "Mirrored ${CI_COMMIT_BRANCH} to lidonation/www.1694.io."
      fi

