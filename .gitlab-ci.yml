variables:
  KUBERNETES_VERSION: 1.24.9
  HELM_VERSION: 3.10.2
  KUBE_CONTEXT: voltaire/www.1694.io:1694 
  AUTO_DEPLOY_IMAGE_VERSION: v1.1.0
  CI_TEMPLATE_REGISTRY_HOST: registry.gitlab.com

stages:
  - .pre
  - build
  - test
  - production
  - .post

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ./node_modules

services:
  - name: docker:dind
    alias: docker
    command: ["--tls=false"]

.auto-deploy:
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  dependencies: []

.setup: &setup
  - apk add --no-cache ca-certificates curl bash openssl git
  - curl -LO https://dl.k8s.io/release/v1.25.9/bin/linux/amd64/kubectl && chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
  - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 && chmod 700 get_helm.sh && DESIRED_VERSION=v$HELM_VERSION ./get_helm.sh
  - kubectl config get-contexts
  - kubectl config use-context voltaire/www.1694.io:1694 

build_image:
  stage: build
  image: docker:stable-git
  retry: 2
  script:
    - *setup
    - |
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building web Dockerfile..."
      docker build --network host  \
        -f Dockerfile -t "$CI_APPLICATION_REPOSITORY/www.1694.com:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/www.1694.com:latest" .
  only:
    - branches


# Keys that start with a dot (.) will not be processed by GitLab CI.
# Staging and canary jobs are disabled by default, to enable them
# remove the dot (.) before the job name.
# https://docs.gitlab.com/ee/ci/yaml/README.html#hidden-keys

# Staging deploys are disabled by default since
# continuous deployment to production is enabled by default
# If you prefer to automatically deploy to staging and
# only manually promote to production, enable this job by setting
# STAGING_ENABLED.

.production: &production_template
  stage: production
  image: alpine:latest
  retry: 1
  script:
    - auto-deploy check_kube_domain
    - auto-deploy ensure_namespace
    - auto-deploy download_chart
    - auto-deploy create_secret
    - deploy
    - auto-deploy persist_environment_url
  environment:
    name: production
    url: https://$CI_PROJECT_PATH_SLUG.$AUTO_DEVOPS_DOMAIN
  artifacts:
    paths: [environment_url.txt]

production:
  <<: *production_template
  only:
    refs:
      - main
  except:
    variables:
      - $STAGING_ENABLED
      - $INCREMENTAL_ROLLOUT_ENABLED
