variables:
  AUTO_DEPLOY_IMAGE_VERSION: v2.50.0
  CI_TEMPLATE_REGISTRY_HOST: registry.gitlab.com
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  HELM_VERSION: 3.10.2
  KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: gitlab-admin
  KUBERNETES_VERSION: 1.24.9
  DEPLOY_CARDANO_DBSYNC:
    value: "false"
    description: "Install cardano dbsync services (ogmios, hasura, postgres, grapql)"
  DEPLOY_WEBSITE:
    value: "true"
    description: "Build and deploy www.lidonation.com"
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/frontend/cache/Cypress"

stages:
  - build
  - preview
  - production
  - test

before_script:
  - |
    export APP_VERSION=$(awk '/version/{gsub(/("|",)/,"",$2);print $2};' frontend/package.json)
    export APP_VERSION_AND_BUILD="${APP_VERSION}-${CI_PIPELINE_ID}"
    export CI_APPLICATION_REPOSITORY=$CI_REGISTRY_IMAGE
    export CI_APPLICATION_TAG=$APP_VERSION_AND_BUILD

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ./node_modules

services:
  - name: docker:dind
    alias: docker
    command: ["--tls=false"]

.auto-deploy:
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  dependencies: []


.deploy_template: &deploy_template
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  retry: 0
  cache: {}



build_frontend:
  stage: build
  image: docker:27-cli
  retry: 1
  script:
    - |
      set -xev

      cat $ENV_FILE_NEXT_PUBLIC_TEMPLATE > frontend/.env.production

      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building Dockerfile with tags $CI_APPLICATION_REPOSITORY/1694.io-frontend:$CI_APPLICATION_TAG and $CI_APPLICATION_REPOSITORY/www.1694.io-frontend:latest ..."
      docker build --network host -f frontend/Dockerfile \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-frontend:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-frontend:latest" .

      docker push "$CI_APPLICATION_REPOSITORY/1694.io-frontend:$CI_APPLICATION_TAG"
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-frontend:latest"
  rules:
    - if: '$DEPLOY_WEBSITE == "true"'

build_backend:
  stage: build
  image: docker:27-cli
  retry: 1
  script:
    - |
      set -xev

      cat $ENV_FILE > backend/.env.production
      cat $ENV_FILE_BACKEND > backend/.env.production
      cat $ENV_FILE_FRONTEND > frontend/.env.production
      cat $ENV_FILE_BACKEND > ./chart/backend_env
            
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building Dockerfile with tags $CI_APPLICATION_REPOSITORY/1694.io-backend:$CI_APPLICATION_TAG and $CI_APPLICATION_REPOSITORY/www.1694.io-backend:latest ..."

      docker build --network host -f backend/Dockerfile \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-backend:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-backend:latest" .
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-backend:$CI_APPLICATION_TAG"
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-backend:latest"
  rules:
    - if: '$DEPLOY_WEBSITE == "true"'

build_queue_backend:
  stage: build
  image: docker:27-cli
  retry: 1
  script:
    - |
      set -xev

      cat $ENV_FILE_QUEUE > queue-backend/.env.production
      cat $ENV_FILE_QUEUE > ./chart/queue_env
            
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      echo "Building Dockerfile with tags $CI_APPLICATION_REPOSITORY/1694.io-queue-backend:$CI_APPLICATION_TAG and $CI_APPLICATION_REPOSITORY/www.1694.io-queue-backend:latest ..."

      docker build --network host -f queue-backend/Dockerfile \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:$CI_APPLICATION_TAG" \
        -t "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:latest" .
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:$CI_APPLICATION_TAG"
      docker push "$CI_APPLICATION_REPOSITORY/1694.io-queue-backend:latest"
  rules:
    - if: '$DEPLOY_WEBSITE == "true"'



app-preview:
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  stage: preview
  script:
    - auto-deploy check_kube_domain
    - auto-deploy download_chart
    # - auto-deploy ensure_namespace
    - |
      set -xev

      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"    
      cat $ENV_FILE_BACKEND > backend/.env.production
      cat $ENV_FILE_FRONTEND > frontend/.env.production
      cp backend/.env.production ./chart/backend_env

      cp $ENV_FILE_FRONTEND ./chart/frontend_env

      cat $ENV_FILE_QUEUE > queue-backend/.env.production
      cp $ENV_FILE_QUEUE ./chart/queue_env

      if [ -n "$GLOBAL_ENV_FILE" ]; then cp "$GLOBAL_ENV_FILE" ./chart/global_env; else touch ./chart/global_env; fi

      # No registry pull secrets are created — the cluster nodes authenticate
      # pulls at the node level (k3s registries.yaml + long-lived read_registry
      # token). A per-deploy secret would only shadow the node creds.

      echo "AUTO_DEVOPS_WEB_DOMAIN: $AUTO_DEVOPS_WEB_DOMAIN"

      helm upgrade $DEPLOYMENT_NAME ./chart --install \
        -f ./chart/values.yaml \
        --timeout 600s \
        --wait \
        --namespace="$KUBE_NAMESPACE" \
        --set image.tag=$CI_APPLICATION_TAG \
        --set backend.replicaCount=1 \
        --set frontend.replicaCount=1 \
        --set queue.replicaCount=1 \
        --set governanceIndexer.replicaCount=1 \
        --set governanceIndexer.image.tag=$INDEXER_TAG \
        --set cnpg.superuserPassword="$CNPG_SUPERUSER_PASSWORD" \
        --set secrets.NEXT_PUBLIC_GOOGLE_API="$NEXT_PUBLIC_GOOGLE_API" \
        --set ingress.hosts[0]="$AUTO_DEVOPS_WEB_DOMAIN" \
        --set ingress.api="$API" \
        --set namespace=$KUBE_NAMESPACE \
        --namespace="$KUBE_NAMESPACE" \
        --create-namespace
    - auto-deploy persist_environment_url
  artifacts:
    paths: [environment_url.txt]
  needs:
    - job: build_frontend
    - job: build_backend
    - job: build_queue_backend
  environment:
    name: preview
  rules:
    - if: $DEPLOY_WEBSITE == 'true'
      when: manual



production:
  stage: production
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  environment:
    name: production
  script:
    - auto-deploy check_kube_domain
    - auto-deploy download_chart
    # - auto-deploy ensure_namespace
    - |
      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"

      cat $ENV_FILE_BACKEND > backend/.env.production
      cat $ENV_FILE_FRONTEND > frontend/.env.production
      cp backend/.env.production ./chart/backend_env

      cp $ENV_FILE_FRONTEND ./chart/frontend_env

      cat $ENV_FILE_QUEUE > queue-backend/.env.production
      cp $ENV_FILE_QUEUE ./chart/queue_env

      if [ -n "$GLOBAL_ENV_FILE" ]; then cp "$GLOBAL_ENV_FILE" ./chart/global_env; else touch ./chart/global_env; fi

      helm upgrade $DEPLOYMENT_NAME ./chart --install \
        -f ./chart/values.yaml \
        -f ./chart/values.prod.yaml \
        --timeout 600s \
        --wait \
        --set image.repository=$CI_APPLICATION_REPOSITORY/www.1694.io \
        --set image.tag=$CI_APPLICATION_TAG \
        --set backend.replicaCount=5 \
        --set frontend.replicaCount=5 \
        --set queue.replicaCount=2 \
        --set governanceIndexer.replicaCount=1 \
        --set governanceIndexer.image.tag=$INDEXER_TAG \
        --set cnpg.superuserPassword="$CNPG_SUPERUSER_PASSWORD" \
        --set ingress.hosts[0]="$AUTO_DEVOPS_WEB_DOMAIN" \
        --set ingress.api="$API" \
        --set namespace=$KUBE_NAMESPACE \
        --namespace="$KUBE_NAMESPACE" \
        --create-namespace
    - auto-deploy persist_environment_url
  artifacts:
    paths: [environment_url.txt]
  needs:
    - job: app-preview
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && ($DEPLOY_WEBSITE == "true")'
      when: manual

# ---------------------------------------------------------------------------
# Governance indexer auto-deploy (triggered by governance-indexer CI)
# Runs helm upgrade --reuse-values so only the indexer image changes —
# all other stack config (backend, frontend, queue) is left untouched.
# ---------------------------------------------------------------------------

deploy-indexer-preview:
  stage: preview
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  environment:
    name: preview
  script:
    - |
      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"
      echo "Deploying governance-indexer $INDEXER_TAG ($INDEXER_SHA) to preview..."
      helm upgrade $DEPLOYMENT_NAME ./chart \
        --reuse-values \
        --timeout 120s \
        --wait \
        --namespace="$KUBE_NAMESPACE" \
        --set governanceIndexer.image.tag="$INDEXER_TAG" \
        --set governanceIndexer.image.sha="$INDEXER_SHA"
      echo "Done."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $INDEXER_TAG && $INDEXER_SHA'

deploy-indexer-production:
  stage: production
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-deploy-image:${AUTO_DEPLOY_IMAGE_VERSION}"
  environment:
    name: production
  script:
    - |
      DEPLOYMENT_NAME="www-1694.$CI_ENVIRONMENT_SLUG"
      echo "Deploying governance-indexer $INDEXER_TAG ($INDEXER_SHA) to production..."
      helm upgrade $DEPLOYMENT_NAME ./chart \
        --reuse-values \
        --timeout 120s \
        --wait \
        --namespace="$KUBE_NAMESPACE" \
        --set governanceIndexer.image.tag="$INDEXER_TAG" \
        --set governanceIndexer.image.sha="$INDEXER_SHA"
      echo "Done."
  needs:
    - job: deploy-indexer-preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $INDEXER_TAG && $INDEXER_SHA && $INDEXER_TAG == "latest"'

