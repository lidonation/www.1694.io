services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: io-1694:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_HOST: web_db
      DATABASE_PORT: 5432
      DATABASE_NAME: 1694
      DATABASE_USERNAME: voltaire
      DATABASE_PASSWORD: postgres
      NODE_ENV: development
      REDIS_HOST: 1694-redis
      REDIS_PORT: 6379
    volumes:
      - "./backend:/app"
    ports:
      - "8000:8000"
    networks:
      - io-1694
    depends_on:
      web_db:
        condition: service_healthy
  queue-backend:
    container_name: queue-backend
    build:
      context: ./queue-backend
      dockerfile: Dockerfile.dev
    image: io-1694-queue:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 9999
      NODE_ENV: development
      REDIS_HOST: 1694-redis
      REDIS_PORT: 6379
    volumes:
      - "./queue-backend:/app"
    ports:
      - "9999:9999"
    networks:
      - io-1694
    depends_on:
      1694-redis:
        condition: service_healthy
      backend:
        condition: service_started

  1694-redis: 
    image: redis:7.2-alpine
    container_name: 1694-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - io-1694
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  dbsync_db:
    image: postgres:17.4-alpine3.21
    environment:
      - POSTGRES_LOGGING=true
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - dbsync-db-data:/var/lib/postgresql/data
      - ../governance-indexer/schema.sql:/docker-entrypoint-initdb.d/02-governance-schema.sql:ro
    restart: on-failure
    networks:
      - io-1694
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ${POSTGRES_ARGS:--c maintenance_work_mem=1GB -c max_parallel_maintenance_workers=4}
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  web_db:
    container_name: voltaire_db
    image: postgres:17.1-bookworm
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRESQL_USERNAME: voltaire
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: 1694
      POSTGRES_LOGGING: true
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: voltaire
      POSTGRES_DB: 1694
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - io-1694
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltaire -d 1694"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - 3000:3000
    networks:
      - io-1694
    volumes:
      - ./frontend:/app
      - /app/.next
    depends_on:
      - backend
    environment:
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    - NODE_ENV=development

  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:10.1.4
    command: [
      "run",
      "--config", "/config/config.json",
      "--database-path", "/data/db",
      "--socket-path", "/ipc/node.socket",
      "--topology", "/config/topology.json"
    ]
    volumes:
      - ./cardanonode/config/network/${CARDANO_NETWORK:-preview}/cardano-node:/config
      - ./cardanonode/config/network/${CARDANO_NETWORK:-preview}/genesis:/genesis
      - node-db:/data
      - node-ipc:/ipc
    restart: on-failure
    environment:
      CARDANO_NODE_SOCKET_PATH: /ipc/node.socket
    logging:
      driver: "json-file"
      options:
        max-size: "400k"
        max-file: "20"
    healthcheck:
      test: [ "CMD", "stat", "/ipc/node.socket" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - io-1694

  cardano-db-sync:
    image: ghcr.io/intersectmbo/cardano-db-sync:13.6.0.5
    environment:
      - DISABLE_LEDGER=${DISABLE_LEDGER}
      - DB_SYNC_CONFIG=${DB_SYNC_CONFIG:-/config/config.json}
      - NETWORK=${CARDANO_NETWORK:-preview}
      - POSTGRES_HOST=dbsync_db
      - POSTGRES_PORT=5432
      - RESTORE_SNAPSHOT=${RESTORE_SNAPSHOT:-}
      - RESTORE_RECREATE_DB=N
      - EXTRA_DB_SYNC_ARGS=${EXTRA_DB_SYNC_ARGS:-}
    depends_on:
      cardano-node:
        condition: service_healthy
      dbsync_db:
        condition: service_healthy
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
    volumes:
      - db-sync-data:/var/lib/cexplorer
      - node-ipc:/node-ipc
      - ./cardanonode/config/network/${CARDANO_NETWORK:-preview}/cardano-db-sync:/config
      - ./cardanonode/config/network/${CARDANO_NETWORK:-preview}/genesis:/genesis
    restart: on-failure
    networks:
      - io-1694
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  governance-indexer:
    image: registry.2lovelaces.io/voltaire/governance-indexer
    container_name: governance-indexer
    environment:
      DATABASE_URL: postgres://voltaire:postgres@web_db:5432/1694
      RUST_LOG: info
    depends_on:
      web_db:
        condition: service_healthy
    networks:
      - io-1694
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - io-1694

  # cypress:
  #   image: cypress/included:cypress-13.13.1-node-20.15.1-chrome-126.0.6478.126-1-ff-128.0-edge-126.0.2592.102-1
  #   # the Docker image to use from https://github.com/cypress-io/cypress-docker-images
  #   #  It is however recommended to use a specific image tag to avoid breaking changes when new images are released, especially when they include new major versions of Node.js or Cypress.
  #   depends_on:
  #     - frontend
  #   environment:
  #     # pass base url to test pointing at the web application
  #     - CYPRESS_baseUrl=http://frontend:3000
  #   working_dir: /e2e
  #   networks:
  #     - io-1694
  #   command: ["npx", "cypress", "open",]
  #   restart: unless-stopped
  #   # share the current folder as volume to avoid copying
  #   volumes:
  #     - ./frontend:/e2e

volumes:
  db-data:
  db-sync-data:
  dbsync-db-data:
  node-db:
  node-ipc:
  redis-data:

secrets:
  postgres_db:
    file: ./config/secrets/postgres_db
  postgres_password:
    file: ./config/secrets/postgres_password
  postgres_user:
    file: ./config/secrets/postgres_user

networks:
  io-1694:
    driver: bridge