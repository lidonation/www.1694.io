services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: io-1694:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_HOST: web_db
      DATABASE_PORT: 5432
      DATABASE_NAME: 1694
      DATABASE_USERNAME: voltaire
      DATABASE_PASSWORD: postgres
      NODE_ENV: development
      REDIS_HOST: 1694-redis
      REDIS_PORT: 6379
    volumes:
      - "./backend:/app"
    ports:
      - "8000:8000"
    networks:
      - io-1694
    depends_on:
      web_db:
        condition: service_healthy
  queue-backend:
    container_name: queue-backend
    build:
      context: ./queue-backend
      dockerfile: Dockerfile.dev
    image: io-1694-queue:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 9999
      NODE_ENV: development
      REDIS_HOST: 1694-redis
      REDIS_PORT: 6379
    volumes:
      - "./queue-backend:/app"
    ports:
      - "9999:9999"
    env_file:
      - ./queue-backend/.env
    networks:
      - io-1694
    depends_on:
      1694-redis:
        condition: service_healthy
      backend:
        condition: service_started

  1694-redis: 
    image: redis:7.2-alpine
    container_name: 1694-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - io-1694
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  

  web_db:
    container_name: voltaire_db
    image: postgres:17.1-bookworm
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_USERNAME: voltaire
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: 1694
      POSTGRES_LOGGING: true
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: voltaire
      POSTGRES_DB: 1694
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - io-1694
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltaire -d 1694"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - 3000:3000
    networks:
      - io-1694
    volumes:
      - ./frontend:/app
      - /app/.next
    depends_on:
      - backend
    environment:
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    - NODE_ENV=development


  governance-indexer:
    image: registry.2lovelaces.io/voltaire/governance-indexer
    container_name: governance-indexer
    environment:
      DATABASE_URL: postgres://voltaire:postgres@web_db:5432/1694
      RUST_LOG: info
    depends_on:
      web_db:
        condition: service_healthy
    networks:
      - io-1694
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - io-1694


volumes:
  db-data:
  db-sync-data:
  dbsync-db-data:
  node-db:
  node-ipc:
  redis-data:

secrets:
  postgres_db:
    file: ./config/secrets/postgres_db
  postgres_password:
    file: ./config/secrets/postgres_password
  postgres_user:
    file: ./config/secrets/postgres_user

networks:
  io-1694:
    driver: bridge