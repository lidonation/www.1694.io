# Contabo routing ownership after shared-domain listener migration.
# TLS Secrets are copied in memory before the initial adoption; no credentials here.
httpRoute:
  enabled: true
  gateway:
    name: public
    namespace: traefik
  listenerSet:
    enabled: true
    keepGatewayParent: false
    clusterIssuer: ""
    certificates:
    - name: adopted-1694-io-tls
      # Offline bootstrap seed; live issuer is preserved by validated Helm lookup.
      issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: letsencrypt-prod-cluster-issuer}
      dnsNames:
      - 1694.io
      - '*.1694.io'
      usages:
      - digital signature
      - key encipherment
