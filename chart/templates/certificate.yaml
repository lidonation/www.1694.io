{{- /*
Explicit Certificate. The Ingress annotation used to have cert-manager's
ingress-shim create (and own) this; with no Ingress left it has to be declared.
The secret name is unchanged, so the certificate already issued is reused.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tls.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    release: "{{ $.Release.Name }}"
spec:
  secretName: {{ .Values.gateway.tls.secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.gateway.tls.clusterIssuer }}
  dnsNames:
  {{- range .Values.gateway.tls.dnsNames }}
    - {{ . | quote }}
  {{- end }}
