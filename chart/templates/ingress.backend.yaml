apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $.Chart.Name }}-backend-ingress"
  namespace: {{ .Values.namespace }}
  labels:
    app: "nextjs"
    release: "{{ $.Release.Name }}"
    service: "{{ .Values.backend.labels.service }}"
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
      traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-http-to-https@kubernetescrd,traefik-default-headers@kubernetescrd"
      traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
    {{- range .hosts }}
        - {{ . }}
    {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  rules:
    - host: {{.Values.ingress.api}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ $.Chart.Name }}-backend-service"
                port:
                  number: 80
