{{- if .Values.cnpg.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: www-1694-cnpg-superuser
  namespace: {{ .Values.namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  # Must be set at deploy time: --set cnpg.superuserPassword=<value>  Never committed.
  password: {{ .Values.cnpg.superuserPassword | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: www-1694-cnpg-cluster
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: www-1694-cnpg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "2GB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      wal_buffers: "16MB"
      log_min_duration_statement: "2000"
      log_statement: "none"

  superuserSecret:
    name: www-1694-cnpg-superuser

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.bootstrap.database | quote }}
      owner: {{ .Values.cnpg.bootstrap.owner | quote }}

  backup:
    retentionPolicy: "14d"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: www-1694-barman-store

  storage:
    storageClass: longhorn
    size: {{ .Values.cnpg.cluster.storage.size | quote }}

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "8Gi"
      cpu: "4"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: www-1694-cnpg-db
  namespace: {{ .Values.namespace }}
spec:
  name: {{ .Values.cnpg.bootstrap.database | quote }}
  owner: {{ .Values.cnpg.bootstrap.owner | quote }}
  cluster:
    name: www-1694-cnpg-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: www-1694-cnpg-daily-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.cnpg.backup.schedule | quote }}
  cluster:
    name: www-1694-cnpg-cluster
  immediate: false
  suspend: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: www-1694-barman-store
  namespace: {{ .Values.namespace }}
spec:
  configuration:
    destinationPath: "s3://{{ .Values.cnpg.backup.s3Bucket }}/db-backups"
    endpointURL: "https://s3.2lovelaces.com"
    s3Credentials:
      accessKeyId:
        name: www-1694-global-secrets
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: www-1694-global-secrets
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: www-1694-global-secrets
        key: AWS_DEFAULT_REGION
    wal:
      compression: gzip
  instanceSidecarConfiguration: {}
{{- end }}
