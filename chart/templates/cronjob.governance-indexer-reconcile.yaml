apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ $.Chart.Name }}-governance-indexer-reconcile"
  namespace: {{ .Values.namespace }}
  labels:
    app: "governance-indexer-reconcile"
    service: "governance-indexer"
spec:
  schedule: {{ .Values.governanceIndexer.reconciler.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: "governance-indexer-reconcile"
            service: "governance-indexer"
        spec:
          imagePullSecrets:
            - name: gitlab-registry-token
          restartPolicy: OnFailure
          containers:
            - name: reconciler
              image: "{{ .Values.governanceIndexer.image.repository }}:{{ .Values.governanceIndexer.image.tag }}"
              imagePullPolicy: Always
              command: ["indexer", "reconcile", "--sql-only"]
              env:
                - name: DATABASE_URL
                  value: "{{ .Values.governanceIndexer.databaseUrl }}"
                - name: RELAY_ADDRESS
                  value: "{{ .Values.governanceIndexer.relayAddress }}"
                - name: RELAY_ADDRESSES
                  value: "{{ .Values.governanceIndexer.relayAddresses }}"
                - name: NETWORK_MAGIC
                  value: "{{ .Values.governanceIndexer.networkMagic }}"
                - name: RUST_LOG
                  value: "{{ .Values.governanceIndexer.rustLog }}"
                {{- if .Values.governanceIndexer.reconciler.blockfrostKey }}
                - name: BLOCKFROST_PROJECT_ID
                  value: "{{ .Values.governanceIndexer.reconciler.blockfrostKey }}"
                {{- end }}
              resources:
                limits:
                  memory: {{ .Values.governanceIndexer.reconciler.resources.limits.memory }}
                  cpu: {{ .Values.governanceIndexer.reconciler.resources.limits.cpu }}
                requests:
                  cpu: {{ .Values.governanceIndexer.reconciler.resources.requests.cpu }}
                  memory: {{ .Values.governanceIndexer.reconciler.resources.requests.memory }}
