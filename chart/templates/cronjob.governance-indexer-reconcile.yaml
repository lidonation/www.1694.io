apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ $.Chart.Name }}-governance-indexer-reconcile"
  namespace: {{ .Values.namespace }}
  labels:
    app: "governance-indexer-reconcile"
    service: "governance-indexer"
spec:
  schedule: "0 */3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: "governance-indexer-reconcile"
            service: "governance-indexer"
        spec:
          imagePullSecrets:
            - name: gitlab-registry-token
          restartPolicy: OnFailure
          containers:
            - name: reconciler
              image: "{{ .Values.governanceIndexer.image.repository }}:{{ .Values.governanceIndexer.image.tag }}"
              imagePullPolicy: Always
              command: ["indexer", "reconcile"]
              env:
                - name: DATABASE_URL
                  value: "{{ .Values.governanceIndexer.databaseUrl }}"
                - name: RELAY_ADDRESS
                  value: "{{ .Values.governanceIndexer.relayAddress }}"
                - name: RELAY_ADDRESSES
                  value: "{{ .Values.governanceIndexer.relayAddresses }}"
                - name: NETWORK_MAGIC
                  value: "{{ .Values.governanceIndexer.networkMagic }}"
                - name: RUST_LOG
                  value: "{{ .Values.governanceIndexer.rustLog }}"
              resources:
                limits:
                  memory: "256Mi"
                  cpu: "200m"
                requests:
                  cpu: "50m"
                  memory: "128Mi"
