apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ $.Chart.Name }}-global-secrets"
  namespace: {{ .Values.namespace }}
data:
  {{ range .Files.Lines "global_env" }}
  {{   if . }}
  {{     $parts := regexSplit "=" . 2 }}
  {{     include "www-1694.ipfs.rejectEnvKey" (dict "key" (index $parts 0) "file" "global_env") }}
  {{     index $parts 0  }}: {{ index $parts 1 | b64enc }}
  {{   end }}
  {{ end }}
