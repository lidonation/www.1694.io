apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $.Chart.Name }}-backend"
  namespace: {{ .Values.namespace }}
  labels:
    app: "nestjs"
    service: "{{ .Values.backend.labels.service }}"
spec:
  selector:
    matchLabels:
      app: "nestjs"
      service: "{{ .Values.backend.labels.service }}"
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: "nestjs"
        service: "{{ .Values.backend.labels.service }}"
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      initContainers:
        - name: wait-db-migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: "{{ $.Chart.Name }}-global-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-backend-secrets"
          command:
            - sh
            - -c
            - |
              until PGPASSWORD="$DATABASE_PASSWORD" pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -q; do
                sleep 2
              done
              yarn run migrate:up
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              cpu: 100m
              memory: 256Mi
      containers:
        - name: app
          image: "{{ .Values.backend.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: "{{ $.Chart.Name }}-global-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-frontend-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-backend-secrets"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            limits:
              memory: 8192Mi
              cpu: 1
            requests:
              cpu: 50m
              memory: 256Mi
          ports:
            - name: backend
              containerPort: 8000
              protocol: TCP
