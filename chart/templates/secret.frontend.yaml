apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ $.Chart.Name }}-frontend-secrets"
  namespace: {{ .Values.namespace }}
data:
  {{- if .Values.preserveExistingAppEnv }}
  {{- include "www-1694.preservedEnv" (dict "root" $ "suffix" "frontend" "file" "frontend_env") | nindent 2 }}
  {{- else }}
  {{- if .Files.Get "frontend_env" }}
  {{ range .Files.Lines "frontend_env" }}
  {{   if . }}
  {{     $parts := regexSplit "=" . 2 }}
  {{     include "www-1694.ipfs.rejectEnvKey" (dict "key" (index $parts 0) "file" "frontend_env") }}
  {{     if not (has (index $parts 0) (list "BLOCKFROST_NETWORK_URL_FALLBACK" "BLOCKFROST_NETWORK_PROJECT_ID_FALLBACK")) }}
  {{     index $parts 0  }}: {{ index $parts 1 | b64enc }}
  {{     end }}
  {{   end }}
  {{ end }}
  {{- end }}

  {{- end }}
