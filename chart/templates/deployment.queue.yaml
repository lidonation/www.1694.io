apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $.Chart.Name }}-queue-backend"
  namespace: {{ .Values.namespace }}
  labels:
    app: "nestjs"
    service: "{{ .Values.queue.labels.service }}"
spec:
  selector:
    matchLabels:
      app: "nestjs"
      service: "{{ .Values.queue.labels.service }}"
  replicas: {{ .Values.queue.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: "nestjs"
        service: "{{ .Values.queue.labels.service }}"
    spec:
      # No imagePullSecrets: pulls authenticate at the node level (k3s registries.yaml).
      containers:
        - name: app
          image: "{{ .Values.queue.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: "9999"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: www-1694-cnpg-cluster-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: www-1694-cnpg-cluster-app
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: www-1694-cnpg-cluster-app
                  key: dbname
            - name: DATABASE_HOST
              value: www-1694-cnpg-pooler
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_URL
              value: "postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@www-1694-cnpg-pooler:5432/$(DATABASE_NAME)"
            - name: REDIS_HOST
              value: www-1694-redis-cluster
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: ""
          envFrom:
            - secretRef:
                name: "{{ $.Chart.Name }}-global-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-frontend-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-backend-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-queue-secrets"
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 8192Mi
              cpu: 1
            requests:
              cpu: 50m
              memory: 256Mi
          ports:
            - name: queue
              containerPort: 9999
              protocol: TCP
          volumeMounts:
            - name: node-ipc
              mountPath: /ipc
              readOnly: false
        - name: ipc
          image: alpine/socat:1.7.4.4
          env:
            - name: CARDANO_NODE_SOCKET_TCP_HOST
              value: "lidolovelace-cardano-relay-1-service"
            - name: CARDANO_NODE_SOCKET_TCP_PORT
              value: "30111"
            - name: SOCAT_TIMEOUT
              value: "3600"
          command:
            [
              "sh",
              "-c",
              "socat UNIX-LISTEN:/ipc/node.socket,fork TCP:${CARDANO_NODE_SOCKET_TCP_HOST}:${CARDANO_NODE_SOCKET_TCP_PORT},ignoreeof",
            ]
          volumeMounts:
            - mountPath: /ipc
              name: node-ipc
              readOnly: false
      volumes:
        - name: node-ipc
          emptyDir: {}