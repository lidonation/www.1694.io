apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $.Chart.Name }}-frontend-ingress"
  namespace: {{ .Values.namespace }}
  labels:
    app: "nextjs"
    release: "{{ $.Release.Name }}"
    service: "{{ .Values.frontend.labels.service }}"
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
      traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-http-to-https@kubernetescrd,traefik-default-headers@kubernetescrd"
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  tls:
  {{- range .Values.ingress.tls }}
  - hosts:
  {{- range .hosts }}
    - {{ . }}
  {{- end }}
    secretName: {{ .secretName }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: "{{ $.Chart.Name }}-frontend-service"
              port:
                number: 80
  {{- end }}
---
{{- if .Values.ingress.redirectApex }}
# Redirect apex domain (e.g. 1694.io) → www.{{ .Values.ingress.apexHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $.Chart.Name }}-apex-redirect-ingress"
  namespace: {{ .Values.namespace }}
  labels:
    app: "nextjs"
    release: "{{ $.Release.Name }}"
    service: "{{ .Values.frontend.labels.service }}"
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
      {{ $key }}: {{ $value | quote }}
    {{- end }}
      traefik.ingress.kubernetes.io/router.middlewares: "traefik-redirect-http-to-https@kubernetescrd,traefik-default-headers@kubernetescrd,{{ .Values.namespace }}-{{ $.Chart.Name }}-redirect-to-www@kubernetescrd"
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  # The wildcard in ingress.tls does not match the apex, so this ingress asks
  # cert-manager for a certificate covering {{ .Values.ingress.apexHost }} alone, in its own
  # secret. A failed apex order then cannot block renewal of the wildcard.
  tls:
  - hosts:
    - {{ .Values.ingress.apexHost | quote }}
    secretName: {{ .Values.ingress.apexTlsSecretName | default "apex-1694-tls" }}
  rules:
  - host: {{ .Values.ingress.apexHost }}
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: "{{ $.Chart.Name }}-frontend-service"
              port:
                number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ $.Chart.Name }}-redirect-to-www"
  namespace: {{ .Values.namespace }}
spec:
  redirectRegex:
    regex: "^https?://{{ .Values.ingress.apexHost }}/(.*)"
    replacement: "https://www.{{ .Values.ingress.apexHost }}/${1}"
    permanent: true
{{- end }}