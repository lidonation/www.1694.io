apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: "{{ $.Chart.Name }}-queue-secrets"
  namespace: {{ .Values.namespace }}
data:
  {{- if .Values.preserveExistingAppEnv }}
  {{- include "www-1694.preservedEnv" (dict "root" $ "suffix" "queue" "file" "queue_env") | nindent 2 }}
  {{- else }}
  {{- if .Files.Get "queue_env" }}
  {{ range .Files.Lines "queue_env" }}
  {{   if and . (not (hasPrefix "#" .)) (contains "=" .) }}
  {{     $parts := regexSplit "=" . 2 }}
  {{     include "www-1694.ipfs.rejectEnvKey" (dict "key" (index $parts 0) "file" "queue_env") }}
  {{     index $parts 0 }}: {{ index $parts 1 | b64enc }}
  {{   end }}
  {{ end }}
  {{- end }}

  {{- end }}
