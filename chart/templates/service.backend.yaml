apiVersion: v1
kind: Service
metadata:
  name: "{{ $.Chart.Name }}-backend-service"
  namespace: {{ .Values.namespace }}
  labels:
    service: "{{ .Values.backend.labels.service }}"
  annotations:
    traefik.ingress.kubernetes.io/affinity: "false"
spec:
  ports:
    - port: 80
      name: backend
      targetPort: backend
      protocol: TCP
  selector:
    service: "{{ .Values.backend.labels.service }}"
