apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $.Chart.Name }}-frontend"
  namespace: {{ .Values.namespace }}
  labels:
    app: "nextjs"
    service: "{{ .Values.frontend.labels.service }}"
spec:
  selector:
    matchLabels:
      app: "nextjs"
      service: "{{ .Values.frontend.labels.service }}"
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: "nextjs"
        service: "{{ .Values.frontend.labels.service }}"
    spec:
      # No imagePullSecrets: pulls authenticate at the node level (k3s registries.yaml).
      containers:
        - name: app
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: "{{ $.Chart.Name }}-global-secrets"
            - secretRef:
                name: "{{ $.Chart.Name }}-frontend-secrets"
          # HTTP probes: a hung next-server keeps the TCP port open, so a
          # tcpSocket check kept routing traffic to pods that never answered.
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: frontend
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: frontend
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            limits:
              memory: 4192Mi
              cpu: 600m
            requests:
              cpu: 50m
              memory: 256Mi
          ports:
            - name: frontend
              containerPort: 3000
              protocol: TCP
