apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $.Chart.Name }}-governance-indexer"
  namespace: {{ .Values.namespace }}
  labels:
    app: "governance-indexer"
    service: "{{ .Values.governanceIndexer.labels.service }}"
spec:
  selector:
    matchLabels:
      app: "governance-indexer"
      service: "{{ .Values.governanceIndexer.labels.service }}"
  replicas: {{ .Values.governanceIndexer.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: "governance-indexer"
        service: "{{ .Values.governanceIndexer.labels.service }}"
      annotations:
        # Unique SHA per commit — changes on every deploy so K8s always does a
        # rolling restart and pulls the new image even if the tag name is the same.
        deploy-sha: "{{ .Values.governanceIndexer.image.sha }}"
    spec:
      # No imagePullSecrets: pulls authenticate at the node level (k3s registries.yaml).
      containers:
        - name: indexer
          image: "{{ .Values.governanceIndexer.image.repository }}:{{ .Values.governanceIndexer.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: www-1694-cnpg-cluster-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: www-1694-cnpg-cluster-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: www-1694-cnpg-cluster-app
                  key: dbname
            - name: DATABASE_URL
              value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@www-1694-cnpg-cluster-rw:5432/$(DB_NAME)"
            - name: RELAY_ADDRESS
              value: "{{ .Values.governanceIndexer.relayAddress }}"
            - name: NETWORK_MAGIC
              value: "{{ .Values.governanceIndexer.networkMagic }}"
            - name: MAX_CONCURRENT_WORKERS
              value: "{{ .Values.governanceIndexer.maxConcurrentWorkers }}"
            - name: BATCH_SIZE
              value: "{{ .Values.governanceIndexer.batchSize }}"
            - name: RUST_LOG
              value: "{{ .Values.governanceIndexer.rustLog }}"
            - name: RELAY_ADDRESSES
              value: "{{ .Values.governanceIndexer.relayAddresses }}"
          resources:
            limits:
              memory: {{ .Values.governanceIndexer.resources.limits.memory }}
              cpu: {{ .Values.governanceIndexer.resources.limits.cpu }}
            requests:
              cpu: {{ .Values.governanceIndexer.resources.requests.cpu }}
              memory: {{ .Values.governanceIndexer.resources.requests.memory }}
      restartPolicy: Always