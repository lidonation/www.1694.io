{{- if .Values.redis.enabled }}
{{- /*
Redis requirepass. Generated on first install and reused on every upgrade so
a deploy never rotates it by accident. To rotate, delete the Secret and
redeploy: Redis, backend and queue all restart onto the new value.
*/}}
{{- $name := .Values.redis.authSecretName }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" }}
{{- else }}
{{- $password = randAlphaNum 48 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
data:
  password: {{ $password }}
{{- end }}
