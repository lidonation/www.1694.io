namespace: voltaire

# The mainnet relays. Preview's are in chart/values.yaml.
queue:
  nodeSocket:
    host: lidolovelace-cardano-relay-1-service.lidolovelace.svc.cluster.local

gateway:
  hosts:
    - www.1694.io
  redirectApex: true
  apexHost: 1694.io
  api: api.1694.io
  tls:
    # A wildcard does not match the zone apex, so 1694.io is carried as a
    # second SAN on the same certificate. This list replaces the one in
    # chart/values.yaml (Helm does not merge lists), which is deliberate:
    # preview has no apex route and must not order a name it does not serve.
    dnsNames:
      - "*.1694.io"
      - "1694.io"

cnpg:
  bootstrap:
    database: "1694_mainnet"
    owner: "voltaire"
  cluster:
    storage:
      # 20Gi since the 2026-10-15 restore onto the new cluster (the database is
      # ~100 MB of dump; Longhorn has no room for 200Gi x2 replicas there). A
      # PVC grows in place but never shrinks, so raise this only with disk.
      size: "20Gi"
  migration:
    sourceDatabase: "1694_mainnet"
    sourceUser: "voltaire"

governanceIndexer:
  image:
    tag: latest   # mutable — always points to latest main build
    sha: ""       # set at deploy time: --set governanceIndexer.image.sha=$CI_COMMIT_SHORT_SHA
  networkMagic: "764824073"
  maxConcurrentWorkers: "16"
  # DATABASE_URL is injected from www-1694-global-secrets (key: DATABASE_URL),
  # set at deploy time via the global_env file and never committed. Expected
  # format: postgres://voltaire:<password>@www-1694-cnpg-pooler:5432/1694_mainnet
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2048Mi
      cpu: 1000m
