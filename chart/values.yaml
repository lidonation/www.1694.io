affinity: {}

app: {
  ADMIN_EMAIL: "webmaster@lidonation.io",
  APP_NAME: "1694.io",
  APP_ENV: "production",
  APP_DEBUG: "false",
  APP_SETUP: "false",
  APP_URL: "https://www.1694.io"
}

certmanager:
  issuer: letsencrypt-prod-issuer
  email: webmaster@lidonation.io
  server: https://acme-staging-v02.api.letsencrypt.org/directory

certificate:
  secretName: www-1694-tls
  hosts:
    - "'*.1694.io'"

secrets:
  NEXT_PUBLIC_GOOGLE_API:

image:
  repository: registry.2lovelaces.io/voltaire/www.1694.io
  tag: latest
  pullPolicy: Always
  pullSecret: 'gitlab-ci-token'

imageCredentials:
  registry: registry.raddcreative.io
  username: someone
  password: sillyness
  email: webmaster@1694.io

ingress:
  enabled: true
  ingressClassName: traefik
  controller:
    headers:
      HTTPS: "on"
  annotations: {
    cert-manager.io/cluster-issuer: letsencrypt-issuer,
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure,web",
  }
  hosts:
    - sancho.1694.io
  api: preview-api.1694.io
  tls:
    - hosts:
        - "'*.1694.io'"
      secretName: wildcard-1694-tls

labels:
  domain: 1694.io

namespace: voltaire-sancho

nodeSelector: {}

redis:
  image: redis:7.2-rc2-alpine

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1024Mi
    cpu: 300m

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 80

backend:
  replicaCount: 2
  labels:
    service: backend
  image:
    repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-backend
  ingress:
    path: /api
    tls:

queue:
  replicaCount: 2
  labels:
    service: queue
  image:
    repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-queue-backend
  ingress:
    path: /api
    tls:


frontend:
  replicaCount: 2
  labels:
    service: frontend
  image:
      repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-frontend
  ingress:
    path: /
    tls:

governanceIndexer:
  replicaCount: 1
  labels:
    service: governance-indexer
  image:
    repository: registry.2lovelaces.io/voltaire/governance-indexer
  
  databaseUrl: "postgres://voltaire:postgres@postgresql:5432/1694"
  relayAddress: "backbone.mainnet.emurgornd.com:3001"
  networkMagic: "764824073"
  maxConcurrentWorkers: "8"
  batchSize: "100"
  rustLog: "info"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
      cpu: 500m
