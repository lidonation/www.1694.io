affinity: {}

app: {
  ADMIN_EMAIL: "webmaster@lidonation.io",
  APP_NAME: "1694.io",
  APP_ENV: "production",
  APP_DEBUG: "false",
  APP_SETUP: "false",
  APP_URL: "https://www.1694.io"
}



certmanager:
  issuer: letsencrypt-prod-issuer
  email: webmaster@lidonation.io
  server: https://acme-staging-v02.api.letsencrypt.org/directory

certificate:
  secretName: www-1694-tls
  hosts:
    - "'*.1694.io'"

secrets:
  NEXT_PUBLIC_GOOGLE_API:

image:
  repository: registry.2lovelaces.io/voltaire/www.1694.io
  tag: latest
  pullPolicy: Always

imageCredentials:
  registry: registry.raddcreative.io
  username: someone
  password: sillyness
  email: webmaster@1694.io

ingress:
  enabled: true
  ingressClassName: traefik
  controller:
    headers:
      HTTPS: "on"
  annotations: {
    cert-manager.io/cluster-issuer: letsencrypt-issuer,
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure,web",
  }
  hosts:
    - sancho.1694.io
  api: preview-api.1694.io
  tls:
    - hosts:
        - "'*.1694.io'"
      secretName: wildcard-1694-tls

labels:
  domain: 1694.io

namespace: voltaire-preview

nodeSelector: {}

redis:
  enabled: true
  storage:
    size: "5Gi"

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1024Mi
    cpu: 300m

serviceAccount:
  create: true

service:
  type: ClusterIP
  port: 80

backend:
  replicaCount: 2
  labels:
    service: backend
  image:
    repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-backend
  ingress:
    path: /api
    tls:

queue:
  replicaCount: 2
  labels:
    service: queue
  image:
    repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-queue-backend
  ingress:
    path: /api
    tls:


frontend:
  replicaCount: 2
  labels:
    service: frontend
  image:
      repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-frontend
  ingress:
    path: /
    tls:

cnpg:
  enabled: true

  cluster:
    storage:
      size: "50Gi"

  bootstrap:
    database: "1694"
    owner: "voltaire"

  # Must be set at deploy time: --set cnpg.superuserPassword=<value>  Never committed.
  superuserPassword: ""

  migration:
    enabled: false
    sourceHost: "postgresql"  # Bitnami ClusterIP service name
    sourcePort: "5432"
    sourceDatabase: "1694"
    sourceUser: "voltaire"
    # Must be set at deploy time: --set cnpg.migration.sourcePassword=<value>  Never committed.
    sourcePassword: ""

governanceIndexer:
  replicaCount: 1
  labels:
    service: governance-indexer
  image:
    repository: registry.2lovelaces.io/voltaire/governance-indexer
    tag: dev      # mutable branch tag — always points to latest build on this branch
    sha: initial  # overwritten by CI with $CI_COMMIT_SHORT_SHA on every deploy
  relayAddresses: "backbone.mainnet.emurgornd.com:3001,relays-new.cardano-mainnet.iohk.io:3001,relay1.lidonation.com:3011"
  relayAddress: "backbone.mainnet.emurgornd.com:3001"

  # DATABASE_URL is injected from www-1694-global-secrets (key: DATABASE_URL).
  # Set at deploy time via global_env file — never committed. Expected format:
  # postgres://voltaire:<password>@www-1694-cnpg-pooler:5432/1694
  databaseUrl: ""  # unused — deployment reads from secretKeyRef
  networkMagic: "764824073"
  maxConcurrentWorkers: "8"
  batchSize: "100"
  rustLog: "info"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
      cpu: 500m


