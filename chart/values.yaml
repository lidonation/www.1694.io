# Application environment is not set here. CI writes the *_env files into this
# chart directory and the secret.* templates load them with .Files.Lines, so
# APP_URL, ADMIN_EMAIL, database credentials and the rest come from GitLab
# CI/CD file variables. Anything added to this file is only read if a template
# references it.

image:
  # Only tag and pullPolicy are read. Each deployment takes its image from its
  # own key below (backend.image.repository and so on), so there is no
  # top-level repository here. The --set image.repository in the production job
  # of .gitlab-ci.yml has no effect for the same reason.
  tag: latest
  pullPolicy: Always

secrets:
  # Read by deployment.frontend.yaml. It arrives by --set, not from an env
  # file, and only the app-preview job sets it. Production currently renders
  # this env var empty, which is a pre-existing gap in .gitlab-ci.yml and not
  # something this file can fix.
  NEXT_PUBLIC_GOOGLE_API:

# TLS is issued by cert-manager's ingress-shim, not by a Certificate resource in
# this chart. The cluster-issuer annotation below, plus the hosts under
# ingress.tls, are the whole mechanism: cert-manager watches these ingresses,
# orders the certificate and writes it into the named secret. The ClusterIssuer
# itself is cluster-scoped and lives in the infrastructure repo, not here.
#
# ingress.hosts and ingress.api are overridden at deploy time by .gitlab-ci.yml
# with --set from the AUTO_DEVOPS_WEB_DOMAIN and API CI/CD variables. The values
# below are the defaults for a manual helm install, not what is live. Read the
# live hostnames with: kubectl get ingress -n <namespace>
ingress:
  ingressClassName: traefik
  annotations: {
    cert-manager.io/cluster-issuer: letsencrypt-prod-cluster-issuer,
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure,web",
  }
  hosts:
    - preview.1694.io
  api: preview-api.1694.io
  # Preview has no apex router, so it asks for the wildcard alone. Production
  # adds the apex as a second SAN on this same certificate, in
  # chart/values.prod.yaml - a wildcard does not match the zone apex.
  tls:
    - hosts:
        - "'*.1694.io'"
      secretName: wildcard-1694-tls

namespace: voltaire-preview

redis:
  enabled: true
  storage:
    size: "5Gi"

backend:
  replicaCount: 2
  labels:
    service: backend
  image:
    repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-backend

queue:
  replicaCount: 2
  labels:
    service: queue
  image:
    repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-queue-backend

frontend:
  replicaCount: 2
  labels:
    service: frontend
  image:
      repository: registry.2lovelaces.io/voltaire/www.1694.io/1694.io-frontend

cnpg:
  enabled: true

  cluster:
    storage:
      size: "50Gi"

  bootstrap:
    database: "1694"
    owner: "voltaire"

  # Must be set at deploy time: --set cnpg.superuserPassword=<value>  Never committed.
  superuserPassword: ""

  migration:
    enabled: false
    sourceHost: "postgresql"  # Bitnami ClusterIP service name
    sourcePort: "5432"
    sourceDatabase: "1694"
    sourceUser: "voltaire"
    # Must be set at deploy time: --set cnpg.migration.sourcePassword=<value>  Never committed.
    sourcePassword: ""

governanceIndexer:
  replicaCount: 1
  labels:
    service: governance-indexer
  image:
    repository: registry.2lovelaces.io/voltaire/governance-indexer
    tag: dev      # mutable branch tag — always points to latest build on this branch
    sha: initial  # overwritten by CI with $CI_COMMIT_SHORT_SHA on every deploy
  relayAddresses: "backbone.mainnet.emurgornd.com:3001,relays-new.cardano-mainnet.iohk.io:3001,relay1.lidonation.com:3011"
  relayAddress: "backbone.mainnet.emurgornd.com:3001"

  # DATABASE_URL is injected from www-1694-global-secrets (key: DATABASE_URL),
  # set at deploy time via the global_env file and never committed. Expected
  # format: postgres://voltaire:<password>@www-1694-cnpg-pooler:5432/1694
  networkMagic: "764824073"
  maxConcurrentWorkers: "8"
  batchSize: "100"
  rustLog: "info"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1024Mi
      cpu: 500m
